[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-equipment-poc"
version = "0.2.0"
description = "Least-privilege Hermes adapters and tools for equipment software PoC"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_equipment_poc = ["resources/*.md"]
