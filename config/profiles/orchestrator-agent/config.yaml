model:
  provider: custom
  # llama.cpp upstream via ContextManager; replace with server --alias if configured.
  default: Qwen3.8-27B-UD-Q5_K_XL.gguf
  base_url: http://REPLACE_CONTEXT_MANAGER_HOST:8091/v1
  api_key: ""

toolsets:
  - skills
  - knowledge_taxonomy
  - equipment_rag_code
  - equipment_rag_document

agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - workspace_read
    - workspace_write
    - git_read
    - git_write
    - git_merge_request
    - dotnet_build
    - log_read
    - memory
    - browser
    - web

plugins:
  enabled: [hermes-equipment-platform]
  entries:
    hermes-equipment-platform:
      settings:
        workspace_root: REPLACE_WORKSPACE_ROOT
        git: {approval_store: "REPLACE_APPROVAL_STORE_OUTSIDE_WORKSPACE"}
        equipment_rag:
          base_url: http://REPLACE_EQUIPMENT_RAG_HOST:8765
          retrieve_path: /v1/retrieve
          health_path: /health

gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8641
    model_name: orchestrator-agent
    max_concurrent_runs: 1

approvals:
  mode: manual
  unattended_mode: deny
